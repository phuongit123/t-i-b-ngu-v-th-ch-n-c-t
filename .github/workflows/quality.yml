name: Quality Gate

on:
  pull_request:
    branches:
      - main
      - fix/phase5-stabilization
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Install, static checks, curriculum tests, build and Edge E2E
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CI: true
      AFFINITY_CROSS_BROWSER: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install exact locked dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Validate all curriculum lessons
        run: npm run validate:curriculum

      - name: Curriculum validator regression tests
        run: npm run test:validator

      - name: Curriculum script checks
        run: npm run test:scripts

      - name: Vietnamese lesson translation coverage
        run: npm run test:translations

      - name: Vietnamese UI and curriculum checks
        run: |
          npm run test:ui-vi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:curriculum-vi

      - name: Backend migrations and integrity
        run: npm run test:backend

      - name: Capstone scoring
        run: npm run test:capstone

      - name: Production build
        run: npm run build

      - name: Install browsers for Playwright
        run: npx playwright install chromium firefox webkit msedge

      - name: Playwright end-to-end suite
        run: npm run test:e2e

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: affinity-academy-quality-evidence
          if-no-files-found: warn
          path: |
            test-results/
            playwright-report/
            tests/screenshots/
