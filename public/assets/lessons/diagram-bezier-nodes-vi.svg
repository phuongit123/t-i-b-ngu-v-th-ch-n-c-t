<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" fill="none">
  <rect width="800" height="440" rx="16" fill="#09090B"/>
  <text x="36" y="46" fill="#F4F4F5" font-family="Inter, sans-serif" font-size="18" font-weight="700">3 Loại Điểm Neo (Node) Trong Đường Cong Bézier</text>
  <text x="36" y="68" fill="#A1A1AA" font-family="Inter, sans-serif" font-size="12">Chuyển đổi linh hoạt trên Context Toolbar của Node Tool [phím A]</text>
  <!-- Card 1: Sharp Node -->
  <rect x="36" y="92" width="230" height="312" rx="12" fill="#111118" stroke="#27272A"/>
  <text x="56" y="124" fill="#F59E0B" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">1. SHARP NODE (GÓC NHỌN)</text>
  <path d="M72 280 L150 175 L228 280" stroke="#F4F4F5" stroke-width="3.5" fill="none"/>
  <rect x="142" y="167" width="16" height="16" fill="#09090B" stroke="#F59E0B" stroke-width="3"/>
  <text x="56" y="328" fill="#E4E4E7" font-family="Inter, sans-serif" font-size="12" font-weight="600">Hình dạng vuông trên path</text>
  <text x="56" y="350" fill="#A1A1AA" font-family="Inter, sans-serif" font-size="11">Hai đoạn gấp góc độc lập hoặc</text>
  <text x="56" y="368" fill="#A1A1AA" font-family="Inter, sans-serif" font-size="11">bẻ gãy tay đòn bằng Alt / Option.</text>
  <!-- Card 2: Smooth Node -->
  <rect x="285" y="92" width="230" height="312" rx="12" fill="#111118" stroke="#00D2FF" stroke-opacity="0.5"/>
  <text x="305" y="124" fill="#00D2FF" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">2. SMOOTH NODE (MƯỢT)</text>
  <path d="M315 285 C335 185, 465 185, 485 285" stroke="#00D2FF" stroke-width="3.5" fill="none"/>
  <line x1="340" y1="210" x2="460" y2="210" stroke="#38BDF8" stroke-width="1.8"/>
  <circle cx="340" cy="210" r="5" fill="#38BDF8"/>
  <circle cx="460" cy="210" r="5" fill="#38BDF8"/>
  <circle cx="400" cy="210" r="8" fill="#09090B" stroke="#00D2FF" stroke-width="3"/>
  <text x="305" y="328" fill="#E4E4E7" font-family="Inter, sans-serif" font-size="12" font-weight="600">Hình tròn · Tiếp tuyến 180°</text>
  <text x="305" y="350" fill="#A1A1AA" font-family="Inter, sans-serif" font-size="11">Hai tay đòn luôn thẳng hàng,</text>
  <text x="305" y="368" fill="#A1A1AA" font-family="Inter, sans-serif" font-size="11">tạo đường lượn sóng liên tục.</text>
  <!-- Card 3: Smart Node -->
  <rect x="534" y="92" width="230" height="312" rx="12" fill="#111118" stroke="#10B981" stroke-opacity="0.5"/>
  <text x="554" y="124" fill="#10B981" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">3. SMART NODE (TỰ ĐỘNG)</text>
  <path d="M565 275 Q649 160, 735 275" stroke="#10B981" stroke-width="3.5" fill="none"/>
  <circle cx="649" cy="218" r="9" fill="#09090B" stroke="#10B981" stroke-width="3"/>
  <circle cx="649" cy="218" r="3" fill="#10B981"/>
  <text x="554" y="328" fill="#E4E4E7" font-family="Inter, sans-serif" font-size="12" font-weight="600">Hình tròn có chấm tâm</text>
  <text x="554" y="350" fill="#A1A1AA" font-family="Inter, sans-serif" font-size="11">Phần mềm tự nội suy đường cong</text>
  <text x="554" y="368" fill="#A1A1AA" font-family="Inter, sans-serif" font-size="11">tối ưu theo hai điểm lân cận.</text>
</svg>
